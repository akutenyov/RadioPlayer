[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radioplayer"
version = "2.6.0"
description = "A PyQt6 desktop client for internet radio streams."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "PyQt6>=6.11,<6.12",
    "requests>=2.34,<3",
]

[project.optional-dependencies]
# Tooling used locally and by CI. Keeping it separate leaves the desktop
# application's runtime installation limited to the two runtime dependencies.
dev = [
    "coverage>=7.6,<8",
    "ruff>=0.12,<1",
]

[tool.coverage.run]
# The UI controller is integration-tested with Qt; the coverage gate focuses
# on deterministic network/data/metadata helpers that unit tests can exercise.
source = ["radio_player.api", "radio_player.metadata", "radio_player.widgets"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Qt selects its platform plugin during import, so tests set QT_QPA_PLATFORM
# immediately beforehand to stay headless in CI.
"tests/test_radio.py" = ["E402"]

[tool.setuptools]
packages = ["radio_player"]
