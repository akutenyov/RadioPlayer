name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the project and development tools
        # Installing the package catches missing package data or metadata that
        # a requirements-only test run would not detect.
        run: python -m pip install ".[dev]"

      - name: Lint Python source
        run: python -m ruff check radio_player tests

      - name: Compile Python source
        run: python -m compileall -q radio.py radio_player

      - name: Run unit tests with coverage
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Report coverage
        run: python -m coverage report
